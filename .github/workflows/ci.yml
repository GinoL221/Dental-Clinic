name: CI

permissions:
  contents: read

on:
  push:
    branches: ['main', 'master', 'develop', 'fix/ui-dates-logger']
  pull_request:
    branches: ['main', 'master', 'develop']

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Show Java info
        run: java -version

      - name: Check Spotless formatting
        run: mvn -B -f backend/pom.xml spotless:check

      - name: Run backend tests and enforce coverage gate
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend Tests (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run pre-commit tool tests (dash and bash)
        run: |
          TEST_SH=dash dash tools/tests/pre-commit.test.sh
          TEST_SH=bash bash tools/tests/pre-commit.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # --omit=dev: @sveltejs/kit@2.70.4 (devDep) needs SvelteKit 3 for
      # GHSA-3r8g-jcqq-3p5j; prod deps have 0 high/critical advisories.
      - name: Run npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SvelteKit types
        working-directory: frontend
        run: npx svelte-kit sync

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend checks
        working-directory: frontend
        run: npm run check

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage gate
        working-directory: frontend
        run: npm run test:coverage

  fullstack-e2e:
    name: Full-Stack E2E (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Fails before installing Chromium or any dependency: names only, never
      # values (spec.md's "Missing credentials fail safely" scenario).
      - name: Fail fast if required E2E credentials are missing
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: |
          missing=()
          for var in \
            JWT_SECRET \
            E2E_ADMIN_EMAIL \
            E2E_ADMIN_PASSWORD \
            E2E_NON_ADMIN_EMAIL \
            E2E_NON_ADMIN_PASSWORD; do
            [ -z "${!var}" ] && missing+=("${var}")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required E2E credential(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium, Firefox & WebKit
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E process-runner unit tests
        working-directory: frontend
        run: npm run test:e2e:process

      - name: Run Mock E2E Chromium suite
        working-directory: frontend
        env:
          E2E_BACKEND_PORT: '18081'
          E2E_FRONTEND_PORT: '14174'
        run: npm run test:e2e

      # run-fullstack.js prints its own readiness/preflight diagnostics
      # (names only, never credential values) to this step's log on failure.
      - name: Run full-stack Chromium + Firefox + Mobile WebKit suite
        working-directory: frontend
        env:
          E2E_ENABLE_FIREFOX: '1'
          E2E_ENABLE_WEBKIT: '1'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: npm run test:e2e:fullstack

      # Reports/traces only — never raw state or .env dumps.
      - name: Upload full-stack report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fullstack-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/playwright-report-fullstack
            frontend/test-results-fullstack
          retention-days: 7

  docker:
    name: Docker Build Check (Backend & Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: docker build -t dental-clinic-backend:ci backend

      - name: Build frontend Docker image
        run: docker build -t dental-clinic-frontend:ci frontend

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
