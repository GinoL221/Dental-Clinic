name: CI

on:
  push:
    branches: ['main', 'master', 'develop', 'fix/ui-dates-logger']
  pull_request:
    branches: ['main', 'master', 'develop']

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Show Java info
        run: java -version

      - name: Run backend tests using system Maven
        run: mvn -B -f backend/pom.xml test

  frontend:
    name: Frontend Tests (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          SESSION_SECRET: ci-test-secret
        run: npm test

  fullstack-e2e:
    name: Full-Stack E2E (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Fails before installing Chromium or any dependency: names only, never
      # values (spec.md's "Missing credentials fail safely" scenario).
      - name: Fail fast if required E2E credentials are missing
        run: |
          missing=()
          [ -z "${{ secrets.JWT_SECRET }}" ] && missing+=("JWT_SECRET")
          [ -z "${{ secrets.E2E_ADMIN_EMAIL }}" ] && missing+=("E2E_ADMIN_EMAIL")
          [ -z "${{ secrets.E2E_ADMIN_PASSWORD }}" ] && missing+=("E2E_ADMIN_PASSWORD")
          [ -z "${{ secrets.E2E_NON_ADMIN_EMAIL }}" ] && missing+=("E2E_NON_ADMIN_EMAIL")
          [ -z "${{ secrets.E2E_NON_ADMIN_PASSWORD }}" ] && missing+=("E2E_NON_ADMIN_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required E2E credential(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # run-fullstack.js prints its own readiness/preflight diagnostics
      # (names only, never credential values) to this step's log on failure.
      - name: Run full-stack Chromium suite
        working-directory: frontend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: npm run test:e2e:fullstack

      # Reports/traces only — never raw state or .env dumps.
      - name: Upload full-stack report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fullstack-report
          path: |
            frontend/playwright-report-fullstack
            frontend/test-results-fullstack
          retention-days: 7
