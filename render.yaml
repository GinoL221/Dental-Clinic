---
services:
  - type: web
    name: dental-clinic-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_DEMO_ENABLED
        value: "true"
      - key: APP_AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BFF_SHARED_SECRET
        sync: false

  - type: web
    name: dental-clinic-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      # Render Free cannot receive private-network traffic; set this to the
      # backend's public https://*.onrender.com URL (without /api).
      - key: BACKEND_URL
        sync: false
      - key: ORIGIN
        sync: false
      - key: BFF_SHARED_SECRET
        sync: false
