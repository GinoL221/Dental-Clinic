# Perfil de produccion — MySQL / TiDB Cloud
# Las variables de entorno deben configurarse en el dashboard de Render / Railway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool Hikari acotado para contenedores de 512 MB y cierres por inactividad (< 30 min en TiDB Starter)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME_MS:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:20000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT secret inyectado por env var
app.jwt.secret=${JWT_SECRET}

# Deshabilitar Swagger UI y OpenAPI en produccion para evitar exposicion de endpoints y esquemas
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Confiar en headers X-Forwarded-* solo desde proxies internos confiables (Tomcat RemoteIpValve)
server.forward-headers-strategy=native
