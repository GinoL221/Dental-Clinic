spring.h2.console.enabled=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:dental-e2e;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.import_files=

app.jwt.secret=${JWT_SECRET}
e2e.admin-email=${E2E_ADMIN_EMAIL}
e2e.admin-password=${E2E_ADMIN_PASSWORD}
e2e.non-admin-email=${E2E_NON_ADMIN_EMAIL}
e2e.non-admin-password=${E2E_NON_ADMIN_PASSWORD}
