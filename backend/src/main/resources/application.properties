spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.servlet.context-path=/api

# Carga variables locales desde backend/.env si existe (no versionado, ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Origen(es) permitidos por CORS, separados por coma. Override con la env var CORS_ALLOWED_ORIGINS
# (por ejemplo, el dominio real del frontend desplegado en prod).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Modo demo público (opt-in para despliegue de portafolio en prod; default false)
app.demo.enabled=${APP_DEMO_ENABLED:false}

# Healthcheck público mínimo para Railway / orquestadores (sin detalles internos)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Rate limiting en endpoints de auth (/auth/login, /auth/register, /auth/change-password, /auth/check-email)
app.rate-limit.auth.enabled=${APP_AUTH_RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.max-requests=${APP_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.auth.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
# Secreto compartido opcional con el BFF SvelteKit para propagar X-Client-IP (fail-closed si vacío)
app.rate-limit.bff-shared-secret=${BFF_SHARED_SECRET:}
